<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Kariba Lake Connect — Book verified boats on Lake Kariba</title>
    <meta
      name="description"
      content="Book verified boats on Lake Kariba, Zimbabwe. Kariba Lake Connect puts tourists in touch with trusted local operators for houseboat stays, fishing trips and sunset cruises."
    />
    <meta name="theme-color" content="#0d2532" />

    <!-- Icons. All generated from src/assets/kariba connect logo.png by
         scripts/build-brandmark.mjs — re-run it if the logo changes. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph / Twitter.
         DEPLOY: og:image is relative here so it works on any preview origin.
         Facebook and LinkedIn resolve it against the page URL, but some
         scrapers (and older WhatsApp builds) only accept an absolute one — so
         once the domain is settled, change it to https://<your-domain>/og-image.png
         and add <meta property="og:url"> with the canonical absolute URL.
         og:url is deliberately absent for now: a relative "/" would tell
         crawlers that every deep link is really the home page. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kariba Lake Connect" />
    <meta property="og:locale" content="en_ZW" />
    <meta property="og:title" content="Kariba Lake Connect — Book verified boats on Lake Kariba" />
    <meta
      property="og:description"
      content="Book verified boats on Lake Kariba, Zimbabwe. Houseboat stays, fishing trips and sunset cruises from trusted local operators."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Kariba Lake Connect logo: a boat on the lake at sunset." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kariba Lake Connect — Book verified boats on Lake Kariba" />
    <meta
      name="twitter:description"
      content="Book verified boats on Lake Kariba, Zimbabwe. Houseboat stays, fishing trips and sunset cruises from trusted local operators."
    />
    <meta name="twitter:image" content="/og-image.png" />
    <meta name="twitter:image:alt" content="The Kariba Lake Connect logo: a boat on the lake at sunset." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
